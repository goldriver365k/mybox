<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MySSD{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/files">MySSD</a>
  <form class="search" action="/search" role="search">
    <input type="search" name="q" value="{{ q or '' }}" placeholder="🔍 파일 또는 폴더 검색" maxlength="100" enterkeyhint="search"{% if request.url.path == "/search" and not q %} autofocus{% endif %}>
  </form>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="logout">로그아웃</button></form>
</header>
<main>
  {% if flash %}<p class="ok">{{ flash }}</p>{% endif %}
  {% block main %}{% endblock %}
</main>
<nav class="bottom">
  <a href="/files">📁<span>내 파일</span></a>
  <a href="/search">🔍<span>검색</span></a>
  {% block navupload %}<a class="up" href="/files">⬆<span>올리기</span></a>{% endblock %}
  <a href="/recent">🕘<span>최근</span></a>
  <a href="/more">☰<span>더보기</span></a>
</nav>
{% block script %}{% endblock %}
</body>
</html>
